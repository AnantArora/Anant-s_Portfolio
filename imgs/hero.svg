<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" fill="none" stroke-linejoin="round" stroke-linecap="round">
  <title>Abstract shapes and stacked boxes</title>

  <!-- big shapes -->
  <g stroke="#1b1a17" stroke-width="5">
    <circle cx="330" cy="190" r="150" fill="#e4572e"/>
    <rect x="50" y="240" width="250" height="250" rx="26" fill="#1f2a44"/>
    <path d="M300 490 A105 105 0 0 1 510 490 Z" fill="#f2b134"/>
    <circle cx="170" cy="130" r="58" fill="#f4f0e6"/>

    <!-- stack of boxes (inventory) -->
    <rect x="80" y="410" width="100" height="62" rx="4" fill="#f4f0e6"/>
    <rect x="190" y="410" width="90" height="62" rx="4" fill="#f2b134"/>
    <rect x="115" y="340" width="110" height="62" rx="4" fill="#f4f0e6"/>
  </g>

  <!-- box tape -->
  <g stroke="#1b1a17" stroke-width="5">
    <path d="M130 410v24M235 410v24M170 340v24"/>
  </g>

  <!-- asterisk -->
  <g stroke="#1b1a17" stroke-width="8">
    <path d="M60 28v64M28 60h64M37 37l46 46M83 37l-46 46"/>
  </g>
</svg>
